name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Rhythm.slnx

      - name: Build
        run: dotnet build Rhythm.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Rhythm.slnx -c Release --no-build --verbosity normal